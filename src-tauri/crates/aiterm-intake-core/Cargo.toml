[package]
name = "aiterm-intake-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "uuid", "macros", "derive"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "process", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
regex = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
anyhow = "1"
dirs = "6"

lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
mail-parser = "0.11"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
parking_lot = "0.12"

axum = { version = "0.8", features = ["ws"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
wiremock = "0.6"
