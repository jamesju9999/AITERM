[package]
name = "aiterm-intake-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "AITerm 問題收集 Client：配對與連線 aiterm-intake-server"

[dependencies]
aiterm-intake-core = { path = "../aiterm-intake-core" }
aiterm-core = { path = "../aiterm-core" }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
thiserror = "1"
