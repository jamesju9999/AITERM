[package]
name = "aiterm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util", "net", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
dirs = "6"
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rcgen = "0.13"
mdns-sd = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
tower-service = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.dependencies]
# Job Object：把派工分頁的 shell 連同它所有後代綁進同一個 Job，關閉 Job 時
# 一起結束。這是 Windows 上唯一能收掉「刻意脫離的背景行程」的機制——
# `taskkill /T` 走的是當下的行程樹，抓不到已經被重新掛走的行程（例如 Agent
# 啟動的開發伺服器），而那些行程會一直佔住卡片的 worktree 目錄。
#
# `Win32_System_Pipes` / `Win32_Storage_FileSystem` / `Win32_System_IO`：具名
# 管線 + `ReadFile`/`WriteFile`（`elevated.rs` 的 `spawn_windows`/
# `PipeReadHandle`/`PipeWriteHandle`）。`Win32_System_IO` 看似沒被直接用到，
# 但 `ReadFile`/`WriteFile` 的函式簽章裡有 `*mut OVERLAPPED`，這個型別要
# `Win32_System_IO` 才會被編進 windows-sys 本身——跟 Task 5（
# `aiterm-elevated-host`）踩過的坑一樣。
#
# `Win32_UI_Shell` / `Win32_System_Registry` / `Win32_UI_WindowsAndMessaging`：
# `ShellExecuteExW`/`SHELLEXECUTEINFOW`/`SW_HIDE`。`Win32_System_Registry`
# 容易漏掉：`SHELLEXECUTEINFOW` 這個型別本身（不只是函式）在 windows-sys
# 0.60.2 原始碼裡被 `#[cfg(feature = "Win32_System_Registry")]` 卡住，因為
# struct 裡有個 `hkeyClass: HKEY` 欄位——沒開這個 feature，struct 定義根本
# 不存在，不是函式連不到而已。
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
