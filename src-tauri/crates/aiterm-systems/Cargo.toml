[package]
name = "aiterm-systems"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "AITerm 的系統連線核心（寫入閘門、CDP、瀏覽器、Playwright 代理、審計）：桌面版與 server 共用"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "derive"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util", "net", "time"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
