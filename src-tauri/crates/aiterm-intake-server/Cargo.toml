[package]
name = "aiterm-intake-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "AITerm 問題收集 Server：常駐收訊、共用佇列，供 AITerm Client 連線"

[lib]
name = "aiterm_intake_server"
path = "src/lib.rs"

[[bin]]
name = "aiterm-intake-server"
path = "src/main.rs"

[dependencies]
aiterm-intake-core = { path = "../aiterm-intake-core" }
aiterm-core = { path = "../aiterm-core" }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
log = "0.4"
parking_lot = "0.12"
rand = "0.9"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "uuid", "macros", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = "0.10"
dirs = "6"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
