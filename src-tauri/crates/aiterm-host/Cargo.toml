[package]
name = "aiterm-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "aiterm-host"
path = "src/main.rs"

[dependencies]
aiterm-core = { path = "../aiterm-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
portable-pty = "0.8"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
