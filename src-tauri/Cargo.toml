[package]
name = "app"
version = "1.17.0"
description = "AI TERM Studio"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# PTY + shell management
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util", "net", "time"] }
# 共享短碼的亂數來源。已透過其他相依進入 Cargo.lock，這裡只是提為直接依賴。
rand = "0.9"
# mDNS 區網自動發現（計畫②C）。純 Rust 實作，macOS/Linux/Windows 都不需要
# 額外安裝 Bonjour 或 Avahi。
mdns-sd = "0.21"
once_cell = "1"
base64 = "0.22"
# 資料庫連線匯出檔的加密（passphrase → Argon2id → AES-256-GCM）
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Claude Code 橋接的本地 HTTP server。hyper/tower/tower-http 已透過
# reqwest 與 tauri 進入 Cargo.lock，這裡只是把 axum 提為直接依賴。
# `ws` 不在 axum 的 default features 裡（default = form/http1/json/
# matched-path/original-uri/query/tokio/tower-log/tracing），遠端終端機共享
# 需要雙向串流，所以顯式打開。不引入新 crate。
axum = { version = "0.8", features = ["ws"] }
# 遠端終端機共享的傳輸加密。rustls / tokio-rustls 已經透過 reqwest 的
# rustls-tls 進入 Cargo.lock，這裡只是提為直接依賴；rcgen 是新的，用來產生
# 每次分享的臨時自簽憑證。
#
# `default-features = false` + `ring` 不可省略：rustls 0.23 與 tokio-rustls
# 0.26 的預設供應者都是 aws_lc_rs，那會拉進 aws-lc-sys（C／組語建置，Windows
# 要 nasm+cmake）。本專案的樹裡目前只有 ring（reqwest 帶進來的），照預設寫
# 會憑空多一個 C 相依並很可能弄壞 Windows CI。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"
# 共享 server 的 TLS accept 迴圈：axum::serve 不吃 TLS，而且導出 SAS 需要
# 每條連線各自的 rustls 狀態，所以自己接。
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
tower-service = "0.3"
rmcp = { version = "3.1.3", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"
bytes = "1"
open = "5"
async-trait = "0.1"
futures-util = "0.3"
# 觀看端的 WebSocket 客戶端。版本必須跟 axum 的 `ws` feature 帶進來的那份
# 一致（0.29），否則相依樹會多出第二份互不相容的拷貝。
tokio-tungstenite = "0.29"

# Config + Secret store (M2)
toml = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
shell-words = "1.1.1"

# Database adapters
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "uuid"] }
tiberius = { version = "0.12", features = ["tds73", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }

rfd = "0.15"

# Mail (M-mail Phase 1)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mail-parser = "0.11"
tauri-plugin-notification = "2"

# Enterprise module
chrono = { version = "0.4", features = ["serde"] }
url = "2"
anydoc = "0.1.9"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

# Windows-only: GetLogicalDrives for the file panel's drive switcher.
# Already present in Cargo.lock as a transitive dependency, so this adds no
# meaningful build cost, and nothing is compiled on macOS or Linux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
