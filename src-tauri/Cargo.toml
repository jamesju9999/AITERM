[package]
name = "app"
version = "1.12.0"
description = "AI TERM Studio"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# PTY + shell management
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "process", "io-util", "net", "time"] }
once_cell = "1"
base64 = "0.22"
# 資料庫連線匯出檔的加密（passphrase → Argon2id → AES-256-GCM）
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Claude Code 橋接的本地 HTTP server。hyper/tower/tower-http 已透過
# reqwest 與 tauri 進入 Cargo.lock，這裡只是把 axum 提為直接依賴。
axum = "0.8"
rmcp = { version = "3.1.3", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1.0"
bytes = "1"
open = "5"
async-trait = "0.1"
futures-util = "0.3"

# Config + Secret store (M2)
toml = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
shell-words = "1.1.1"

# Database adapters
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "uuid"] }
tiberius = { version = "0.12", features = ["tds73", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }

rfd = "0.15"

# Mail (M-mail Phase 1)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
mail-parser = "0.11"
tauri-plugin-notification = "2"

# Enterprise module
chrono = { version = "0.4", features = ["serde"] }
url = "2"
anydoc = "0.1.9"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Windows-only: GetLogicalDrives for the file panel's drive switcher.
# Already present in Cargo.lock as a transitive dependency, so this adds no
# meaningful build cost, and nothing is compiled on macOS or Linux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
