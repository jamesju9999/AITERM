name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch for when the tag-push webhook is delayed/degraded
  # (e.g. a GitHub-side incident). Invoke with `gh workflow run release.yml
  # --ref <existing-tag>` — github.ref_name below then resolves to that tag,
  # same as a normal tag-push trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Single writer for release creation. Six parallel build jobs each calling
  # tauri-action's getOrCreateRelease would scan for a same-tag draft and, on a
  # simultaneous miss, create duplicates — GitHub permits several drafts per tag
  # because a draft carries no real tag ref. Passing releaseId to the build steps
  # skips that path entirely: tauri-action only calls getOrCreateRelease when
  # tagName is set and releaseId is not (src/index.ts, `if (tagName && !releaseId)`).
  #
  # It also puts the release name and body in one place rather than six, which is
  # how two of them drifted out of sync with the real artifact names.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      # git log needs the full history and every tag to resolve the previous
      # release. The default shallow checkout has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # These tests have no other CI gate — this repo has no PR-level workflow.
      # Running them here means a broken release_notes.py stops the release
      # before it can write a malformed body, rather than after.
      - name: Test the release-notes helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate the changelog draft
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          # No previous tag (first release): RANGE degrades to $TAG, covering
          # the whole history rather than failing.
          RANGE=${PREV:+$PREV..}$TAG
          echo "range: $RANGE"
          {
            echo "list<<CHANGELOG_EOF"
            git log --pretty=format:%s "$RANGE" | python3 scripts/release_notes.py draft
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or reuse the draft release
        id: create
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_BODY: |
            ## AITerm ${{ github.ref_name }}

            ### 更新項目
            <!-- changelog:start -->
            ${{ steps.changelog.outputs.list }}
            <!-- changelog:end -->

            ### 下載
            - **macOS** (Apple Silicon): 下載 `.dmg` 安裝檔
            - **Windows**: 下載 `-setup.exe` 安裝檔
            - **Linux x86_64 AppImage** (Ubuntu 22.04+): 下載 `_amd64.AppImage`
            - **Linux x86_64 .deb** (Ubuntu 24.04+): 下載 `_amd64.deb`
            - **Linux ARM64 AppImage** (Ubuntu 22.04+ ARM): 下載 `_aarch64.AppImage`
            - **Linux ARM64 .deb** (Ubuntu 24.04+ ARM): 下載 `_arm64.deb`

            > **macOS 首次開啟提示（僅限手動安裝 `.dmg`）：** 若出現「已損毀」或「無法驗證開發者」，請在「終端機」執行：
            > ```
            > xattr -cr /Applications/AITerm.app
            > ```
            > 之後改用 App 內建的自動更新升級時就不會再遇到——更新檔由 App 直接下載，不經瀏覽器，因此不會被加上 quarantine 屬性。
            > **Linux AppImage：** 執行前需加執行權限：
            > ```
            > chmod +x AITerm_*.AppImage && ./AITerm_*.AppImage
            > ```
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            // A draft has no tag ref, so getReleaseByTag cannot see it — scan
            // instead. This also makes a re-run reuse the previous attempt's
            // draft rather than adding a second one.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter((r) => r.tag_name === tag);
            // Prefer a published release: `gh` resolves a tag via
            // /releases/tags/{tag}, which returns the published one, so picking a
            // leftover draft here would have the builds upload to one release
            // while finalize reads another. This repo already carries such
            // duplicates from before releaseId was used (v0.1.77, v0.1.94).
            const existing = matches.find((r) => !r.draft) ?? matches[0];
            if (existing) {
              core.info(`Reusing release ${existing.id} (draft=${existing.draft})`);
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              // Parity with tauri-action's create-release, which passed
              // `commitish || context.sha`. Ignored when the tag already exists.
              target_commitish: context.sha,
              name: `AITerm ${tag}`,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id}`);
            return String(data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: linux-x64-appimage
            db2_arch: x64
            db2_sidecar_dir: binaries/db2-sidecar-linux-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            artifact_name: linux-x64-deb
            db2_arch: x64
            db2_sidecar_dir: binaries/db2-sidecar-linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64-appimage
            db2_arch: arm64
            db2_sidecar_dir: binaries/db2-sidecar-linux-arm64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64-deb
            db2_arch: arm64
            db2_sidecar_dir: binaries/db2-sidecar-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      # An empty release_id makes tauri-action fall through to
      # "No releaseId or tagName provided, skipping all uploads..." and exit 0 —
      # six green builds with nothing uploaded. Reachable via a partial
      # "Re-run failed jobs", which does not re-run create-release. Fail loudly.
      - name: Assert releaseId is present
        shell: bash
        run: |
          test -n "${{ needs.create-release.outputs.release_id }}" \
            || { echo "::error::create-release produced an empty release_id"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Isolate cache per build target so AppImage/deb/macOS/Windows never
          # share partial artifacts, which causes E0463 "can't find crate" errors.
          shared-key: ${{ matrix.artifact_name }}

      # Linux: install WebKitGTK and other Tauri system dependencies
      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev


      # Setup Java 21 (Temurin) + Maven — needed to build db2sidecar.jar from source (all platforms)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # macOS: build Java sidecar from source and download bundled JRE
      - name: Build DB2 sidecar (macOS)
        if: matrix.os == 'macos-latest'
        run: bash scripts/setup-db2-mac.sh

      # Windows: reqwest uses rustls-tls, tiberius uses native-tls (Schannel) — no OpenSSL needed

      # Windows: build Java sidecar from source and download bundled JRE
      - name: Build DB2 sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts\setup-db2-win.ps1

      # Linux .deb only: build Java sidecar and bundle it.
      # AppImage builds intentionally skip DB2 — linuxdeploy fails when the JRE's .so
      # files are in the AppDir (it tries to resolve libjvm.so's internal deps and errors out).
      # Users who need DB2 on Linux should install the .deb package.
      - name: Build DB2 sidecar (Linux .deb)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: ARCH=${{ matrix.db2_arch }} bash scripts/setup-db2-linux.sh

      - name: Patch tauri.linux.conf.json with DB2 resources (Linux .deb)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          python3 -c "
          import json
          conf = {
            'bundle': {
              'externalBin': [],
              'resources': {
                '${{ matrix.db2_sidecar_dir }}': 'db2-sidecar',
                '../tools/ApiDocFetcher/*.py': 'ApiDocFetcher/',
                '../tools/ApiDocFetcher/strategies/*.py': 'ApiDocFetcher/strategies/',
                '../tools/ApiDocFetcher/requirements.txt': 'ApiDocFetcher/requirements.txt'
              }
            }
          }
          print(json.dumps(conf, indent=2))
          " > src-tauri/tauri.linux.conf.json

      # macOS: inject db2-sidecar directory path into tauri.macos.conf.json so
      # Tauri bundles it as a directory (preserves jre/ structure) rather than
      # a glob (which flattens the tree and breaks the JVM).
      - name: Patch tauri.macos.conf.json with DB2 resources (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python3 -c "
          import json
          conf = json.load(open('src-tauri/tauri.macos.conf.json'))
          conf['bundle']['resources']['binaries/db2-sidecar-mac-arm64'] = 'db2-sidecar'
          print(json.dumps(conf, indent=2))
          " > src-tauri/tauri.macos.conf.json.tmp && mv src-tauri/tauri.macos.conf.json.tmp src-tauri/tauri.macos.conf.json

      - name: Sync version from tag
        shell: node {0}
        run: |
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          conf.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');

          let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargo = cargo.replace(/^version = ".*"/m, `version = "${version}"`);
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);

          console.log(`Version synced to ${version}`);

      - name: Install frontend dependencies
        run: npm install

      # Ad-hoc sign the macOS bundle so Gatekeeper shows "unidentified developer"
      # (right-click → Open to bypass) instead of the harder-to-dismiss "damaged" error.
      # Full notarization requires an Apple Developer account; use APPLE_CERTIFICATE
      # and APPLE_ID secrets when available.
      - name: Build (macOS arm64)
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target aarch64-apple-darwin

      - name: Copy ApiDocFetcher scripts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/ApiDocFetcher/strategies | Out-Null
          New-Item -ItemType Directory -Force -Path src-tauri/resources/ApiDocFetcher/tests | Out-Null
          Copy-Item tools/ApiDocFetcher/*.py src-tauri/resources/ApiDocFetcher/
          Copy-Item tools/ApiDocFetcher/requirements.txt src-tauri/resources/ApiDocFetcher/
          Copy-Item tools/ApiDocFetcher/strategies/*.py src-tauri/resources/ApiDocFetcher/strategies/
          Copy-Item tools/ApiDocFetcher/tests/*.py src-tauri/resources/ApiDocFetcher/tests/

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install nsis --version 3.11 -y

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis

      # Ubuntu 22.04: AppImage only (distro-agnostic, works on Ubuntu 22.04+)
      - name: Build (Linux AppImage — Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target x86_64-unknown-linux-gnu --bundles appimage

      # Ubuntu 24.04 x64: .deb only (uses t64 runtime deps, works on Ubuntu 24.04+)
      - name: Build (Linux x64 .deb — Ubuntu 24.04)
        if: matrix.os == 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target x86_64-unknown-linux-gnu --bundles deb

      # Ubuntu 22.04 ARM64: AppImage only (works on ARM Ubuntu 22.04+)
      - name: Build (Linux ARM64 AppImage — Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04-arm'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target aarch64-unknown-linux-gnu --bundles appimage

      # linuxdeploy bundles libwayland-client.so.0 from the build base, and
      # AppRun puts $APPDIR/usr/lib ahead of the system on LD_LIBRARY_PATH. The
      # host's Mesa then loads a build-base-era libwayland, eglGetPlatformDisplay
      # fails with EGL_BAD_PARAMETER, and WebKitGTK aborts — a blank window on
      # any host newer than the builder. Verified on Ubuntu 26.04 aarch64:
      # removing these four files and nothing else makes the app render.
      #
      # libwayland-client.so.0 is on the official AppImage excludelist for
      # exactly this reason (pkg2appimage excludelist, citing mesa#11316), but
      # linuxdeploy embeds that list at compile time and the prebuilt binary
      # Tauri pins predates the entry. Bumping tauri-cli does not help: 2.10.1
      # and 2.11.4 fetch the identical pinned linuxdeploy URL.
      #
      # Two consequences worth knowing:
      #  * Repacking swaps linuxdeploy's runtime for appimagetool's, so both the
      #    tool and the runtime are pinned rather than tracking `continuous` —
      #    a release pipeline should not pull floating upstream binaries.
      #  * Dropping the bundled libwayland raises the compatibility floor to
      #    hosts with libwayland >= 1.20 (Ubuntu 22.04+), because the bundled
      #    GTK3 needs wl_proxy_marshal_flags. That matches what the release
      #    notes already promise, but it is now load-bearing.
      #
      # Repacking invalidates the updater signature, so it is regenerated here
      # and both assets are re-uploaded before `finalize` reads the .sig files.
      - name: Strip bundled libwayland from the AppImage
        if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGETOOL_VERSION: "1.9.1"
          TYPE2_RUNTIME_VERSION: "20251108"
        run: |
          set -euo pipefail
          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          # Absolute: the self-check below runs inside `cd "$workdir"` subshells.
          APP=$(realpath "$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)")
          echo "Repacking $(basename "$APP") for $ARCH"

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          cp "$APP" "$workdir/orig.AppImage"
          chmod +x "$workdir/orig.AppImage"
          ( cd "$workdir" && ./orig.AppImage --appimage-extract >/dev/null )

          # Fail loudly if the premise no longer holds — a silent no-op here
          # would ship a broken AppImage that still looks fine on the release page.
          if ! ls "$workdir"/squashfs-root/usr/lib/libwayland-*.so* >/dev/null 2>&1; then
            echo "::error::No bundled libwayland found — linuxdeploy behaviour changed, re-check this workaround"
            exit 1
          fi
          rm -v "$workdir"/squashfs-root/usr/lib/libwayland-*.so*

          case "$ARCH" in
            x86_64)
              APPIMAGETOOL_SHA=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              RUNTIME_SHA=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64)
              APPIMAGETOOL_SHA=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              RUNTIME_SHA=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
            *) echo "::error::unexpected arch $ARCH"; exit 1 ;;
          esac

          fetch_pinned() { # url dest sha256
            curl -sSfL -o "$2" "$1"
            if ! echo "$3  $2" | sha256sum -c - >/dev/null 2>&1; then
              echo "::error::checksum mismatch for $1 — upstream replaced a pinned asset"
              exit 1
            fi
          }
          fetch_pinned \
            "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$ARCH.AppImage" \
            "$workdir/appimagetool" "$APPIMAGETOOL_SHA"
          fetch_pinned \
            "https://github.com/AppImage/type2-runtime/releases/download/$TYPE2_RUNTIME_VERSION/runtime-$ARCH" \
            "$workdir/runtime" "$RUNTIME_SHA"
          chmod +x "$workdir/appimagetool"

          ARCH="$ARCH" "$workdir/appimagetool" --appimage-extract-and-run \
            --runtime-file "$workdir/runtime" \
            "$workdir/squashfs-root" "$workdir/repacked.AppImage"
          # Move into place only once the repack succeeded, so a failure never
          # leaves a half-written AppImage in the bundle directory.
          mv "$workdir/repacked.AppImage" "$APP"
          rm -f "$workdir/orig.AppImage"

          # Prove the repack removed them, rather than trusting the rm. This also
          # confirms the pinned runtime can read the archive appimagetool wrote.
          rm -rf "$workdir/squashfs-root"
          cp "$APP" "$workdir/check.AppImage"
          chmod +x "$workdir/check.AppImage"
          ( cd "$workdir" && ./check.AppImage --appimage-extract >/dev/null )
          if ls "$workdir"/squashfs-root/usr/lib/libwayland-*.so* >/dev/null 2>&1; then
            echo "::error::libwayland still present after repack"
            exit 1
          fi
          echo "Confirmed: no libwayland in the repacked AppImage"

          # Delete first so the assertion cannot pass on tauri-action's stale .sig.
          rm -f "$APP.sig"
          npx tauri signer sign "$APP"
          test -f "$APP.sig" || { echo "::error::signature not regenerated"; exit 1; }

          gh release upload "$TAG" "$APP" "$APP.sig" --clobber

      # Ubuntu 24.04 ARM64: .deb only (uses t64 runtime deps, works on ARM Ubuntu 24.04+)
      - name: Build (Linux ARM64 .deb — Ubuntu 24.04)
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: false
          args: --target aarch64-unknown-linux-gnu --bundles deb

  # Six parallel build jobs cannot each write latest.json — the later writer would
  # drop the earlier writer's platform entries. This job is the single writer: it
  # runs only after every build finishes, composes the full manifest, then flips
  # the release out of draft so users never see a half-populated manifest.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs
          ls -la sigs

      - name: Compose latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]
          version = tag[1:] if tag.startswith("v") else tag

          def platform_for(name):
              if name.endswith(".app.tar.gz"):
                  return "darwin-aarch64"
              if name.endswith("-setup.exe"):
                  return "windows-x86_64"
              if name.endswith(".AppImage"):
                  return "linux-aarch64" if ("aarch64" in name or "arm64" in name) else "linux-x86_64"
              return None

          platforms = {}
          for sig_path in sorted(pathlib.Path("sigs").glob("*.sig")):
              artifact = sig_path.name[:-4]  # strip ".sig"
              key = platform_for(artifact)
              if key is None:
                  print(f"skipping unrecognised artifact: {artifact}")
                  continue
              platforms[key] = {
                  "signature": sig_path.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{artifact}",
              }
              print(f"{key} <- {artifact}")

          # Load-bearing: this is the only thing preventing a silent gap. Tasks 7/8
          # gave the app no fallback update check, so if a build target is ever added
          # without a matching platform key here, that platform's users will see
          # "up to date" forever with no notification that a release shipped.
          expected = {"darwin-aarch64", "windows-x86_64", "linux-x86_64", "linux-aarch64"}
          missing = expected - set(platforms)
          if missing:
              sys.exit(f"missing updater artifacts for: {sorted(missing)}")

          manifest = {
              "version": version,
              "notes": f"https://github.com/{repo}/releases/tag/{tag}",
              # RFC 3339 with a Z suffix. tauri-plugin-updater parses this strictly —
              # a malformed value fails deserialization of the whole manifest for every
              # platform, so it is generated here rather than taken from event payload.
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
