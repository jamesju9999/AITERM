name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            artifact_name: mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS: DB2 adapter requires unixODBC
      - name: Install unixODBC (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install unixodbc

      # Windows: reqwest uses rustls-tls, tiberius uses native-tls (Schannel) — no OpenSSL needed

      # Windows: download pre-built DB2 sidecar binaries from dedicated release
      - name: Download DB2 sidecar binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.0.0-db2-binaries --pattern "db2-sidecar-win-x64.zip" --repo ${{ github.repository }}
          Expand-Archive -Path db2-sidecar-win-x64.zip -DestinationPath src-tauri/binaries/

      - name: Install frontend dependencies
        run: npm install

      - name: Build (macOS arm64)
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AITerm ${{ github.ref_name }}
          releaseBody: |
            ## AITerm ${{ github.ref_name }}

            ### 下載
            - **macOS** (Apple Silicon / Intel via Rosetta 2): 下載 `.dmg` 安裝檔
            - **Windows**: 下載 `-setup.exe` 安裝檔

            > macOS 首次開啟可能需要在「系統設定 > 隱私與安全性」中允許執行。
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AITerm ${{ github.ref_name }}
          releaseBody: |
            ## AITerm ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
