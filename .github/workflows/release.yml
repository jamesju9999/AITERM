name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            artifact_name: mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            artifact_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # macOS: DB2 adapter requires unixODBC
      - name: Install unixODBC (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install unixodbc

      # Windows: DB2 adapter requires ODBC; native-tls requires OpenSSL
      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install openssl -y
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:\Program Files\OpenSSL-Win64\include" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\Program Files\OpenSSL-Win64\lib" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm install

      - name: Build (macOS Universal)
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AITerm ${{ github.ref_name }}
          releaseBody: |
            ## AITerm ${{ github.ref_name }}

            ### 下載
            - **macOS**: 下載 `.dmg` 安裝檔
            - **Windows**: 下載 `-setup.exe` 安裝檔

            > macOS 首次開啟可能需要在「系統設定 > 隱私與安全性」中允許執行。
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AITerm ${{ github.ref_name }}
          releaseBody: |
            ## AITerm ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
