name: CI

# The release workflow only runs on tag pushes, and GitHub scopes caches by ref,
# so a cache written by one tag can never be read by the next. Caches written on
# the default branch are the only ones a tag run can restore — that is what
# warm-cache below exists to produce.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Caches are evicted after 7 days without access. Without this, a quiet week
  # loses everything warm-cache built.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate. Kept separate from warm-cache so a type error is reported in two
  # minutes rather than after a six-platform build.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # `tsc -b`, never `tsc --noEmit`: the root tsconfig.json is a solution file
      # ("files": []), so --noEmit type-checks nothing and always exits 0. That is
      # exactly how a type error reached CI and failed all six release legs of
      # v1.2.4. This line is the reason this job exists.
      - name: Type check
        run: npx tsc -b

      - name: Frontend tests
        run: npm run test

      - name: Release-notes helper tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Guards the whole point of warm-cache: a drifted matrix produces caches
      # under keys no release run looks up, and the only symptom is that some
      # legs stay slow.
      - name: Check the cache matrix matches release.yml
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_ci_matrix.py

  # Runs `cargo test` for the Rust backend. Before this job existed, the only
  # Rust step in CI was warm-cache's `cargo build --release`, which never runs
  # `cargo test` and is skipped on pull_request entirely — so a PR that broke
  # a Rust unit test (or a wire-format invariant like Profile::marker_key()
  # matching its serde form) went fully green. This job is the fix, and it
  # MUST run on pull_request — that's the whole point, unlike warm-cache.
  #
  # Three OSes, not ubuntu-only: several tests branch on platform (paths.rs
  # venv_interpreter returns "Scripts/python.exe" on Windows, exe_name uses
  # cfg!(windows), marker.rs has a #[cfg(unix)] permission test), and those
  # branches are only exercised by actually running on that OS. The extra
  # runner cost buys real coverage of code this branch added.
  rust-test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            shared_key: pr-test-mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shared_key: pr-test-windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            shared_key: pr-test-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # Same reason as warm-cache: build.rs calls tauri_build::build(), which
      # resolves frontendDist ("../dist") at compile time — on `cargo test`
      # just as much as `cargo build` — so dist/ has to exist first.
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Deliberately separate shared-key namespace from warm-cache's (mac /
      # windows / linux-*): this job caches a debug-profile `cargo test`
      # build, not the release-profile build release.yml restores, and PR-ref
      # caches are never readable outside the PR anyway (see warm-cache's own
      # comment on why it skips pull_request). Keeping the keys apart avoids
      # any chance of this job's cache being confused with the one
      # release.yml depends on.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.shared_key }}

      # Same placeholder as warm-cache's, and needed for the same reason:
      # tauri-build validates every bundle.externalBin entry at compile time
      # regardless of whether the invocation ever bundles, and a 0-byte file
      # is enough to satisfy the existence check (measured — see warm-cache's
      # uv placeholder step for the full explanation).
      - name: Placeholder for the uv externalBin
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          FILE="src-tauri/binaries/uv-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            FILE="${FILE}.exe"
          fi
          [ -f "$FILE" ] || : > "$FILE"

      # Windows-only, same reason as warm-cache: only tauri.windows.conf.json
      # has a db2-sidecar entry under bundle.resources.
      - name: Placeholder for the Windows sidecar resource
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          if (-not (Test-Path src-tauri/binaries/db2-sidecar-win-x64)) {
            New-Item -ItemType File -Path src-tauri/binaries/db2-sidecar-win-x64 | Out-Null
          }

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # Full `cargo test`, not `--lib`: the tests/ integration suite (wiremock
      # HTTP mocks against a local server, in-memory sqlite, real-but-local
      # PTY/shell processes) has no network or OS-keychain dependency, so it
      # runs cleanly here (verified locally: 367 lib tests + all tests/
      # integration tests pass). The 7 keychain-gated tests are #[ignore]d;
      # plain `cargo test` never adds `--ignored`, so they stay skipped.
      # Windows 要多一步：先 --no-run 建出測試執行檔，替每一個放一份
      # side-by-side manifest，再真的跑。
      #
      # 為什麼：muda（Tauri 的原生選單）靜態 import comctl32 的
      # TaskDialogIndirect，而這個函式只存在 comctl32 **v6**。System32 的
      # comctl32 是 v5.82，沒有這個匯出；v6 住在 WinSxS，只有執行檔宣告相依
      # Microsoft.Windows.Common-Controls 6.0.0.0 時，載入器才解析得到。
      # 正式的 app.exe 由 tauri-build 嵌了同樣內容的 manifest 所以一直沒事
      # （tauri-build/src/windows-app-manifest.xml），但 Cargo 的測試 harness
      # 是另一個 target，拿不到那份 manifest——測試執行檔會在 main 之前就死在
      # 載入器手上，STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139)，一個測試都不會
      # 跑，而 CI 只看得到 exit code，完全看不出原因。
      #
      # master 只是剛好沒把 muda 連進測試執行檔而躲過；這顆地雷跟任何特定功能
      # 無關，隨時可能被別的改動引爆。
      #
      # 為什麼用外部 .manifest 而不是連結參數（兩條都實測撞牆過）：
      #   - build.rs 的 cargo::rustc-link-arg-tests 搆不到 lib 的單元測試
      #     target：加了之後測試執行檔一個 byte 都沒變。
      #   - RUSTFLAGS 的 /MANIFEST:EMBED 會連 `cargo test` 順便建的 app bin
      #     一起套到，跟 tauri-build 已經嵌好的那份撞成
      #     「CVT1100: duplicate resource type:MANIFEST」→ LNK1123。
      # 外部 manifest 完全不碰連結參數，正式產物零影響。
      - name: Rust tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --target ${{ matrix.target }} --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 放給全部測試執行檔，不要試圖挑「只有需要的那些」：曾經縮成只給
          # lib 的單元測試 exe，結果 bridge_end_to_end 立刻以 0xC0000139 死掉
          # ——它走到 bridge → chatgpt_web → tauri webview，同樣連進了 muda。
          # 哪些 exe 會連進去是連結器的決定，不是可以從測試名稱看出來的。
          $exes = @(Get-ChildItem "target/${{ matrix.target }}/debug/deps/*.exe")
          if ($exes.Count -eq 0) { throw "沒有找到任何測試執行檔，manifest 會放不到位" }
          foreach ($e in $exes) {
            Copy-Item windows-tests.manifest "$($e.FullName).manifest" -Force
          }
          Write-Host "已為 $($exes.Count) 個測試執行檔放置 side-by-side manifest"
          cargo test --target ${{ matrix.target }}

      - name: Rust tests
        if: matrix.os != 'windows-latest'
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

  # Produces the caches that release.yml restores. Every field below is aligned
  # with release.yml's build matrix on purpose: swatinem/rust-cache derives its
  # key from the runner OS, the shared-key and the Cargo.lock hash, so any
  # mismatch silently yields a cache no release run will ever read.
  warm-cache:
    # A PR's cache would be scoped to the PR ref and unreadable by anything else.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            shared_key: mac
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            shared_key: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            shared_key: linux-x64-appimage
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            shared_key: linux-x64-deb
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            shared_key: linux-arm64-appimage
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            shared_key: linux-arm64-deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # tauri-build resolves frontendDist ("../dist"), so the directory has to
      # exist before cargo runs.
      - name: Build frontend
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.shared_key }}

      # tauri-build validates every entry in bundle.resources and bundle.externalBin
      # (both — see the uv placeholder step below for the externalBin case). Only
      # tauri.windows.conf.json references binaries/db2-sidecar-win-x64 as a
      # committed resource; the macOS and Linux confs only gain a db2-sidecar
      # resource entry when release.yml patches them at release-build time, which
      # this job never runs. That's why only Windows needs a db2 placeholder here.
      #
      # A placeholder is enough here: this job never bundles, so the file is only
      # ever checked for existence, and the dependency compilation this cache
      # exists for does not depend on its contents. release.yml builds the real
      # sidecar with scripts/setup-db2-win.ps1.
      - name: Placeholder for the Windows sidecar resource
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          if (-not (Test-Path src-tauri/binaries/db2-sidecar-win-x64)) {
            New-Item -ItemType File -Path src-tauri/binaries/db2-sidecar-win-x64 | Out-Null
          }

      # tauri-build DOES validate every entry in bundle.externalBin (measured —
      # cargo check fails with "resource path ... doesn't exist" when
      # src-tauri/binaries/uv-<triple> is missing, and a 0-byte file is enough
      # to pass, same as the db2 placeholder above). uv is registered in
      # externalBin on all three platform confs, so every leg here needs its
      # own placeholder before cargo runs.
      #
      # A placeholder is enough here for the same reason as the Windows sidecar
      # one: this job never bundles, only checks existence, and the dependency
      # compilation this cache exists for does not depend on the binary's
      # contents. release.yml fetches the real binary with scripts/setup-uv-*.
      - name: Placeholder for the uv externalBin
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          FILE="src-tauri/binaries/uv-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            FILE="${FILE}.exe"
          fi
          [ -f "$FILE" ] || : > "$FILE"

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # --release, matching the profile `tauri build` uses. A debug target dir
      # would fill the cache with artifacts the release run cannot reuse.
      #
      # cargo build rather than the full tauri build: this skips bundling and
      # signing, which the cache does not need, while still compiling every
      # dependency — the part that costs 8 minutes.
      #
      # tauri-build DOES verify externalBin (see the placeholder step above) —
      # the uv-<triple> placeholder created there is what lets this succeed.
      - name: Build (release profile)
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.target }}
